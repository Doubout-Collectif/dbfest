name: CI/CD - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbcfest-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy DBCFest Production

    if: github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux, X64]

    timeout-minutes: 20

    environment: production

    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      DEPLOY_HOST: 192.168.44.249
      DEPLOY_PORT: 5422
      DEPLOY_USER: deploy-dbcfest-prod
      DEPLOY_BASE: /opt/dbcfest/prod

      SSH_KEY: /home/github-dbcfest/.ssh/dbcfest_prod_deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.13.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate production configuration
        run: |
          set -euo pipefail

          test -n "$NEXT_PUBLIC_SANITY_PROJECT_ID" || {
            echo "NEXT_PUBLIC_SANITY_PROJECT_ID is missing"
            exit 1
          }

          test -n "$NEXT_PUBLIC_SANITY_DATASET" || {
            echo "NEXT_PUBLIC_SANITY_DATASET is missing"
            exit 1
          }

          test -n "$SANITY_API_READ_TOKEN" || {
            echo "SANITY_API_READ_TOKEN is missing"
            exit 1
          }

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build production
        run: |
          pnpm --filter web build

      - name: Prepare standalone package
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy

          cp -a web/.next/standalone/. deploy/

          mkdir -p deploy/web/.next

          rm -rf deploy/web/.next/static
          cp -a web/.next/static deploy/web/.next/static

          rm -rf deploy/web/public
          cp -a web/public deploy/web/public

          test -f deploy/web/server.js

          echo "Deployment package:"
          du -sh deploy

      - name: Define release
        run: |
          echo "RELEASE=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create production release directory
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_BASE/releases/$RELEASE'"

      - name: Upload production release
        run: |
          rsync \
            -az \
            --delete \
            -e "ssh -p $DEPLOY_PORT -i $SSH_KEY -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE/releases/$RELEASE/"

      - name: Activate production release
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE='$RELEASE' DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'

          set -euo pipefail

          NEW_RELEASE="$DEPLOY_BASE/releases/$RELEASE"
          CURRENT="$DEPLOY_BASE/current"
          PREVIOUS_LINK="$DEPLOY_BASE/previous"

          echo "New release: $NEW_RELEASE"

          test -d "$NEW_RELEASE"
          test -f "$NEW_RELEASE/web/server.js"

          OLD_CURRENT="$(readlink -f "$CURRENT" 2>/dev/null || true)"

          echo "Current release before deployment: ${OLD_CURRENT:-none}"

          ROLLBACK_TARGET="$OLD_CURRENT"

          # En cas de redéploiement du même commit,
          # conserver l'ancienne release précédente comme rollback.
          if [ "$OLD_CURRENT" = "$NEW_RELEASE" ] && [ -L "$PREVIOUS_LINK" ]; then
            ROLLBACK_TARGET="$(readlink -f "$PREVIOUS_LINK")"
          fi

          # Mémoriser la release actuellement en production.
          if [ -n "$OLD_CURRENT" ] \
             && [ -d "$OLD_CURRENT" ] \
             && [ "$OLD_CURRENT" != "$NEW_RELEASE" ]; then

            rm -f "$PREVIOUS_LINK.new"

            ln -s \
              "$OLD_CURRENT" \
              "$PREVIOUS_LINK.new"

            mv -Tf \
              "$PREVIOUS_LINK.new" \
              "$PREVIOUS_LINK"
          fi

          # Bascule atomique de current.
          rm -f "$CURRENT.new"

          ln -s \
            "$NEW_RELEASE" \
            "$CURRENT.new"

          mv -Tf \
            "$CURRENT.new" \
            "$CURRENT"

          echo "Current now points to:"
          readlink -f "$CURRENT"

          sudo -n systemctl restart dbcfest-prod.service

          HEALTHY=0

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              HEALTHY=1
              break
            fi

            echo "Local health check $attempt/15..."
            sleep 2
          done

          if [ "$HEALTHY" -eq 1 ]; then
            echo "Production local health check successful"
            exit 0
          fi

          echo "Production local health check failed"

          if [ -n "$ROLLBACK_TARGET" ] \
             && [ -d "$ROLLBACK_TARGET" ] \
             && [ "$ROLLBACK_TARGET" != "$NEW_RELEASE" ]; then

            echo "Rolling back to:"
            echo "$ROLLBACK_TARGET"

            rm -f "$CURRENT.rollback"

            ln -s \
              "$ROLLBACK_TARGET" \
              "$CURRENT.rollback"

            mv -Tf \
              "$CURRENT.rollback" \
              "$CURRENT"

            sudo -n systemctl restart dbcfest-prod.service

            for attempt in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                echo "Rollback successful"
                exit 1
              fi

              sleep 2
            done

            echo "CRITICAL: rollback health check failed"
          else
            echo "No usable rollback target"
          fi

          exit 1
          REMOTE

      - name: Verify production from runner
        id: network-health
        run: |
          set -euo pipefail

          for attempt in $(seq 1 10); do
            if curl \
              --fail \
              --silent \
              --show-error \
              "http://$DEPLOY_HOST:3000/" \
              >/dev/null
            then
              echo "Production is reachable from Bolt"
              exit 0
            fi

            echo "Network health check $attempt/10..."
            sleep 3
          done

          echo "Production network health check failed"
          exit 1

      - name: Roll back after network health failure
        if: failure() && steps.network-health.outcome == 'failure'
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT="$DEPLOY_BASE/current"
          PREVIOUS_LINK="$DEPLOY_BASE/previous"

          if [ ! -L "$PREVIOUS_LINK" ]; then
            echo "No previous production release available"
            exit 1
          fi

          PREVIOUS="$(readlink -f "$PREVIOUS_LINK")"

          echo "Rolling production back to:"
          echo "$PREVIOUS"

          test -d "$PREVIOUS"
          test -f "$PREVIOUS/web/server.js"

          rm -f "$CURRENT.rollback"

          ln -s \
            "$PREVIOUS" \
            "$CURRENT.rollback"

          mv -Tf \
            "$CURRENT.rollback" \
            "$CURRENT"

          sudo -n systemctl restart dbcfest-prod.service

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Rollback successful"
              exit 0
            fi

            sleep 2
          done

          echo "CRITICAL: rollback failed"
          exit 1
          REMOTE

      - name: Cleanup old production releases
        if: success()
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'

          set -euo pipefail

          RELEASES="$DEPLOY_BASE/releases"

          CURRENT="$(readlink -f "$DEPLOY_BASE/current" 2>/dev/null || true)"
          PREVIOUS="$(readlink -f "$DEPLOY_BASE/previous" 2>/dev/null || true)"

          echo "Current:  ${CURRENT:-none}"
          echo "Previous: ${PREVIOUS:-none}"

          count=0

          while IFS= read -r release; do

            if [ "$release" = "$CURRENT" ] || [ "$release" = "$PREVIOUS" ]; then
              continue
            fi

            name="$(basename "$release")"

            # Sécurité : uniquement les dossiers correspondant
            # à des hashes Git.
            if [[ ! "$name" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "Skipping non-release directory: $release"
              continue
            fi

            count=$((count + 1))

            # Conserver 3 releases supplémentaires,
            # en plus de current et previous.
            if [ "$count" -le 3 ]; then
              continue
            fi

            echo "Removing old production release:"
            echo "$release"

            rm -rf -- "$release"

          done < <(
            find "$RELEASES" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' \
            | sort -nr \
            | cut -d' ' -f2-
          )
          REMOTE

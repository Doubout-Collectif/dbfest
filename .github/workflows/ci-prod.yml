name: CI/CD - Production

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy DBCFest Production
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    environment: production

    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      DEPLOY_HOST: 192.168.44.249
      DEPLOY_PORT: 5422
      DEPLOY_USER: deploy-dbcfest-prod
      DEPLOY_BASE: /opt/dbcfest/prod
      SSH_KEY: /home/github-dbcfest/.ssh/dbcfest_prod_deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.13.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate Sanity configuration
        run: |
          test -n "$NEXT_PUBLIC_SANITY_PROJECT_ID"
          test -n "$NEXT_PUBLIC_SANITY_DATASET"
          test -n "$SANITY_API_READ_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter web build

      - name: Prepare deployment package
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy

          cp -a web/.next/standalone/. deploy/

          mkdir -p deploy/web/.next
          cp -a web/.next/static deploy/web/.next/static
          cp -a web/public deploy/web/public

          test -f deploy/web/server.js
          du -sh deploy

      - name: Define release
        run: |
          echo "RELEASE=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create remote release
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_BASE/releases/$RELEASE'"

      - name: Upload release
        run: |
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -i $SSH_KEY -o IdentitiesOnly=yes" \
            deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE/releases/$RELEASE/"

      - name: Activate production release
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE='$RELEASE' DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          NEW_RELEASE="$DEPLOY_BASE/releases/$RELEASE"
          CURRENT="$DEPLOY_BASE/current"
          PREVIOUS_LINK="$DEPLOY_BASE/previous"

          test -f "$NEW_RELEASE/web/server.js"

          PREVIOUS="$(readlink -f "$CURRENT" || true)"

          if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
            rm -f "$PREVIOUS_LINK.new"
            ln -s "$PREVIOUS" "$PREVIOUS_LINK.new"
            mv -Tf "$PREVIOUS_LINK.new" "$PREVIOUS_LINK"
          fi

          rm -f "$CURRENT.new"
          ln -s "$NEW_RELEASE" "$CURRENT.new"
          mv -Tf "$CURRENT.new" "$CURRENT"

          sudo -n systemctl restart dbcfest-prod.service

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Production local health check successful"
              exit 0
            fi

            echo "Health check $attempt/15..."
            sleep 2
          done

          echo "Production health check failed"

          if [ -L "$PREVIOUS_LINK" ]; then
            PREVIOUS="$(readlink -f "$PREVIOUS_LINK")"

            rm -f "$CURRENT.rollback"
            ln -s "$PREVIOUS" "$CURRENT.rollback"
            mv -Tf "$CURRENT.rollback" "$CURRENT"

            sudo -n systemctl restart dbcfest-prod.service
          fi

          exit 1
          REMOTE

name: CI/CD - Test

on:
  push:
    branches:
      - test

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy DBCFest Test
    nano .github/workflows/ci-test.yml
    runs-on: [self-hosted, Linux, X64]

    environment: test

    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      DEPLOY_HOST: 192.168.44.249
      DEPLOY_PORT: 5422
      DEPLOY_USER: deploy-dbcfest
      DEPLOY_BASE: /opt/dbcfest/test
      SSH_KEY: /home/github-dbcfest/.ssh/dbcfest_deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.13.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate Sanity configuration
        run: |
          test -n "$NEXT_PUBLIC_SANITY_PROJECT_ID" || {
            echo "NEXT_PUBLIC_SANITY_PROJECT_ID missing"
            exit 1
          }

          test -n "$NEXT_PUBLIC_SANITY_DATASET" || {
            echo "NEXT_PUBLIC_SANITY_DATASET missing"
            exit 1
          }

          test -n "$SANITY_API_READ_TOKEN" || {
            echo "SANITY_API_READ_TOKEN missing"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter web build

      - name: Prepare deployment package
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy

          cp -a web/.next/standalone/. deploy/

          mkdir -p deploy/web/.next

          cp -a web/.next/static deploy/web/.next/static
          cp -a web/public deploy/web/public

          test -f deploy/web/server.js

          echo "Deployment package:"
          du -sh deploy

      - name: Define release
        run: |
          echo "RELEASE=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create remote release directory
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_BASE/releases/$RELEASE'"

      - name: Upload release
        run: |
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -i $SSH_KEY -o IdentitiesOnly=yes" \
            deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE/releases/$RELEASE/"

      - name: Activate release
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE='$RELEASE' DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          NEW_RELEASE="$DEPLOY_BASE/releases/$RELEASE"
          CURRENT="$DEPLOY_BASE/current"
          PREVIOUS_LINK="$DEPLOY_BASE/previous"

          test -f "$NEW_RELEASE/web/server.js"

          PREVIOUS="$(readlink -f "$CURRENT" || true)"

          echo "Previous release: $PREVIOUS"
          echo "New release:      $NEW_RELEASE"

          # Mémoriser la release précédente
          if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
            rm -f "$PREVIOUS_LINK.new"
            ln -s "$PREVIOUS" "$PREVIOUS_LINK.new"
            mv -Tf "$PREVIOUS_LINK.new" "$PREVIOUS_LINK"
          fi

          # Basculer current atomiquement
          rm -f "$CURRENT.new"
          ln -s "$NEW_RELEASE" "$CURRENT.new"
          mv -Tf "$CURRENT.new" "$CURRENT"

          sudo -n systemctl restart dbcfest-test.service

          HEALTHY=0

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              HEALTHY=1
              break
            fi

            echo "Health check local $attempt/15..."
            sleep 2
          done

          if [ "$HEALTHY" -eq 1 ]; then
            echo "Local health check successful"
            exit 0
          fi

          echo "Local health check failed — rollback"

          if [ -L "$PREVIOUS_LINK" ]; then
            OLD_RELEASE="$(readlink -f "$PREVIOUS_LINK")"

            rm -f "$CURRENT.rollback"
            ln -s "$OLD_RELEASE" "$CURRENT.rollback"
            mv -Tf "$CURRENT.rollback" "$CURRENT"

            sudo -n systemctl restart dbcfest-test.service
          fi

          exit 1
          REMOTE

      - name: Verify public endpoint
        id: public-health
        run: |
          for attempt in $(seq 1 10); do
            if curl \
              --fail \
              --silent \
              --show-error \
              https://test.dbcfest.com/ \
              >/dev/null
            then
              echo "Public endpoint is healthy"
              exit 0
            fi

            echo "Public health check $attempt/10 failed"
            sleep 3
          done

          echo "Public endpoint failed"
          exit 1

      - name: Roll back after public health check failure
        if: failure() && steps.public-health.outcome == 'failure'
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          CURRENT="$DEPLOY_BASE/current"
          PREVIOUS_LINK="$DEPLOY_BASE/previous"

          if [ ! -L "$PREVIOUS_LINK" ]; then
            echo "No previous release available"
            exit 1
          fi

          PREVIOUS="$(readlink -f "$PREVIOUS_LINK")"

          echo "Rolling back to: $PREVIOUS"

          test -f "$PREVIOUS/web/server.js"

          rm -f "$CURRENT.rollback"
          ln -s "$PREVIOUS" "$CURRENT.rollback"
          mv -Tf "$CURRENT.rollback" "$CURRENT"

          sudo -n systemctl restart dbcfest-test.service

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              echo "Rollback successful"
              exit 0
            fi

            sleep 2
          done

          echo "CRITICAL: rollback health check failed"
          exit 1
          REMOTE

      - name: Cleanup old releases
        if: success()
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_BASE='$DEPLOY_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          RELEASES="$DEPLOY_BASE/releases"

          CURRENT="$(readlink -f "$DEPLOY_BASE/current" || true)"
          PREVIOUS="$(readlink -f "$DEPLOY_BASE/previous" || true)"

          echo "Current:  $CURRENT"
          echo "Previous: $PREVIOUS"

          count=0

          while IFS= read -r release; do
            # Toujours conserver current et previous
            if [ "$release" = "$CURRENT" ] || [ "$release" = "$PREVIOUS" ]; then
              continue
            fi

            count=$((count + 1))

            # Conserver encore 3 releases supplémentaires
            if [ "$count" -le 3 ]; then
              continue
            fi

            echo "Removing old release: $release"
            rm -rf -- "$release"

          done < <(
            find "$RELEASES" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' \
            | sort -nr \
            | cut -d' ' -f2-
          )
          REMOTE
